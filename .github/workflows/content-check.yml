name: Check website content

on:
  pull_request:
    paths:
      - 'content/**'
      - 'img/**'
      - 'scripts/validate-content.mjs'
      - 'scripts/**'
      - 'index.html'
      - 'package.json'
      - 'js/site.js'
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'img/**'
      - 'scripts/validate-content.mjs'
      - 'scripts/**'
      - 'index.html'
      - 'package.json'
      - 'js/site.js'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate-content.mjs
      - run: node scripts/render-content.mjs --check
      - run: node --test scripts/test-content-loading.mjs
